name: Sync Learning Log

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 * * *'  # 每天 UTC 15:00 (北京时间 23:00)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Progress
        run: |
          echo "=== 项目检查 ==="
          echo "文档数量: $(find docs/ -name '*.md' | wc -l)"
          echo "脚本数量: $(find scripts/ -name '*.sh' | wc -l)"
          echo "日志天数: $(find daily-logs/ -name '*.md' | wc -l)"
          
          echo ""
          echo "=== Git Stats ==="
          git log --oneline --shortstat -5
